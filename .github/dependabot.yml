version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: [rogierlommers]

  - package-ecosystem: "github-actions"
    assignees: [rogierlommers]
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infrastructure"

  - package-ecosystem: "docker"
    assignees: [rogierlommers]
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "infrastructure"
