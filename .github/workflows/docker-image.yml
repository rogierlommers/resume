name: Build and run application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ./bin/resume ./src/*.go

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-binary
          path: ./bin/resume

  build-and-push-image:
    # Only build and push the Docker image when changes are pushed to the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: compiled-binary
          path: ./bin

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            rogierlommers/resume:${{ github.sha }}
            rogierlommers/resume:latest

  deploy:
    name: "Deploy and verify"
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:

      # More info: https://github.com/tailscale/github-action
      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ssh.key
          chmod 600 ~/.ssh/ssh.key
          tailscale ip -4 services | xargs ssh-keyscan -H >> ~/.ssh/known_hosts
          cat >>~/.ssh/config <<END
          Host services
            HostName $(tailscale ip -4 services)
            User $SSH_USER
            IdentityFile ~/.ssh/ssh.key
            StrictHostKeyChecking yes
            Port 22
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Run docker-compose commands
        run: ssh services "cd /srv/local && docker pull rogierlommers/resume:${GITHUB_SHA} && docker tag rogierlommers/resume:${GITHUB_SHA} rogierlommers/resume:latest && docker compose up -d --pull never resume"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify deployment
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://rogier.lommers.org/healthz

      - name: Run tailscale logout
        run: sudo tailscale logout
