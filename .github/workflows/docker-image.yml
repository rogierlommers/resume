name: Build and run application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ./bin/resume ./src/*.go

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiled-binary
          path: ./bin/resume

  build-and-push-image:
    # Only build and push the Docker image when changes are pushed to the main branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-binary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: compiled-binary
          path: ./bin

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            rogierlommers/resume:${{ github.sha }}
            rogierlommers/resume:latest

      - name: Smoke test image
        run: |
          docker run -d --name resume-smoke-test -p 18080:8080 rogierlommers/resume:${{ github.sha }}
          trap 'docker rm -f resume-smoke-test' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:18080/healthz

  deploy:
    name: "Deploy and verify"
    runs-on: ubuntu-latest
    needs: build-and-push-image

    steps:

      # More info: https://github.com/tailscale/github-action
      - name: Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/ssh.key
          chmod 600 ~/.ssh/ssh.key
          tailscale ip -4 services | xargs ssh-keyscan -H >> ~/.ssh/known_hosts
          cat >>~/.ssh/config <<END
          Host services
            HostName $(tailscale ip -4 services)
            User $SSH_USER
            IdentityFile ~/.ssh/ssh.key
            StrictHostKeyChecking yes
            Port 22
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Run docker-compose commands
        run: ssh services "cd /srv/local && docker pull rogierlommers/resume:${GITHUB_SHA} && docker tag rogierlommers/resume:${GITHUB_SHA} rogierlommers/resume:latest && docker compose up -d --pull never resume"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify deployment
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://rogier.lommers.org/healthz

      - name: Run tailscale logout
        run: sudo tailscale logout
